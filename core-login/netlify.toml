[build]
  command = "npm run build"
  publish = "dist"

# CORS para todos los assets — necesario para que el shell cargue el MFE desde otro origen
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
